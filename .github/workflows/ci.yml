name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `version:` here — pnpm/action-setup now errors if it conflicts with package.json's
      # own "packageManager" field (pnpm@11.24.0), rather than just preferring one. Reading it
      # from package.json is also the one place the real version can't drift out of sync.
      - uses: pnpm/action-setup@v4

      # pnpm@11.24.0 (package.json's packageManager) requires Node >=22.13 — Node 20 fails at the
      # pnpm-install step itself (ERR_UNKNOWN_BUILTIN_MODULE: node:sqlite) before any project code
      # even runs. package.json's engines.node matches this too.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run build
